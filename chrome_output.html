    <script>
      window.addEventListener('error', function(event) {
        showErrorOverlay(event.error || { message: event.message, stack: 'No stack trace available.' });
      });
      window.addEventListener('unhandledrejection', function(event) {
        showErrorOverlay(event.reason || { message: 'Unhandled Promise Rejection', stack: 'No stack trace available.' });
      });

      function showErrorOverlay(err) {
        console.error('Captured Global Error:', err);
        var overlay = document.getElementById('debug-error-overlay');
        if (!overlay) {
          overlay = document.createElement('div');
          overlay.id = 'debug-error-overlay';
          overlay.style.position = 'fixed';
          overlay.style.top = '0';
          overlay.style.left = '0';
          overlay.style.width = '100%';
          overlay.style.height = '100%';
          overlay.style.backgroundColor = 'rgba(255, 0, 0, 0.95)';
          overlay.style.color = '#fff';
          overlay.style.padding = '20px';
          overlay.style.zIndex = '999999';
          overlay.style.overflow = 'auto';
          overlay.style.fontFamily = 'monospace';
          overlay.style.fontSize = '14px';
          overlay.style.boxSizing = 'border-box';
          
          var title = document.createElement('h1');
          title.innerText = 'Runtime JavaScript Error';
          title.style.margin = '0 0 10px 0';
          title.style.borderBottom = '2px solid white';
          title.style.paddingBottom = '10px';
          overlay.appendChild(title);

          var msg = document.createElement('p');
          msg.id = 'debug-error-msg';
          msg.style.fontWeight = 'bold';
          overlay.appendChild(msg);

          var stack = document.createElement('pre');
          stack.id = 'debug-error-stack';
          stack.style.whiteSpace = 'pre-wrap';
          stack.style.backgroundColor = '#222';
          stack.style.padding = '15px';
          stack.style.borderRadius = '5px';
          overlay.appendChild(stack);

          document.body.appendChild(overlay);
        }
        
        document.getElementById('debug-error-msg').innerText = err.message || err.toString();
        document.getElementById('debug-error-stack').innerText = err.stack || 'No stack trace available.';
      }
    </script>

/* --- CLASSE DE CONTAINER MOBILE PADRÃO --- */

.mobile-viewport-container {
  max-width: 430px;
  margin: 0 auto;
  background-color: var(--bg-hex);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  position: relative;
  box-shadow: 0 0 40px rgba(0, 0, 0, 0.04);
}

/* --- ESTILO GRUBGO TOP CURVE --- */

.curved-hero-header {
  background-color: var(--primary-hex);
  border-radius: 0 0 50% 50% / 0 0 100px 100px;
  padding: 24px 16px 80px 16px;
  position: relative;
  z-index: 10;
  display: flex;
  flex-direction: column;
}

/* --- CLASSES DE TIPOGRAFIA UNIFICADA --- */

.text-h1 {
  font-family: 'Poppins', sans-serif;
  font-size: 2.2rem;
  font-weight: 700;
  color: var(--primary-hex);
  letter-spacing: -0.02em;
  line-height: 1.2;
}

.text-h2 {
  font-family: 'Poppins', sans-serif;
  font-size: 1.15rem;
  font-weight: 600;
  color: var(--text-hex);
  line-height: 1.3;
}

.text-btn {
  font-family: 'Poppins', sans-serif;
  font-size: 1rem;
  font-weight: 600;
  letter-spacing: 0.01em;
  color: #ffffff;
}

.text-body-custom {
  font-family: 'Poppins', sans-serif;
  font-size: 0.95rem;
  font-weight: 400;
  color: var(--text-hex);
  line-height: 1.5;
}

.text-metadata {
  font-family: 'Poppins', sans-serif;
  font-size: 0.8rem;
  font-weight: 400;
  color: var(--text-muted-hex);
}

/* --- GRUBGO CARD BASE --- */

.grubgo-card {
  background-color: #FFFFFF;
  border: none;
  border-radius: 20px;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.06);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.grubgo-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 15px 50px rgba(0, 0, 0, 0.08);
}

/* --- GRID E ESPAÇAMENTO RÍGIDO --- */

.page-padding {
  padding-left: 16px;
  padding-right: 16px;
}

.card-padding-sm {
  padding: 16px;
}

.card-padding-lg {
  padding: 24px;
}

.gap-rigid {
  gap: 16px;
}

/* --- ARREDONDAMENTOS E ELEVAÇÃO (FLAT & ELEVADO SUTIL) --- */

.rounded-standard {
  border-radius: 16px;
}

.rounded-full-custom {
  border-radius: 9999px;
}

.elevation-sutil {
  box-shadow: 0 4px 6px -1px rgba(15, 23, 42, 0.05), 0 2px 4px -2px rgba(15, 23, 42, 0.05);
}

.shadow-none-custom {
  box-shadow: none;
}

/* --- BARRAS DE BUSCA E INPUTS (ALTURA 54PX) --- */

.search-bar-container {
  display: flex;
  align-items: center;
  width: 100%;
  height: 54px;
  background-color: var(--card-bg-hex);
  border: none;
  box-shadow: var(--float-shadow);
  border-radius: 9999px;
  padding: 0 8px 0 20px;
  gap: 8px;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.search-bar-container:focus-within {
  transform: translateY(-2px);
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.12);
}

.search-input-field {
  flex-grow: 1;
  border: none;
  background: transparent;
  font-family: 'Poppins', sans-serif;
  font-size: 0.95rem;
  color: var(--text-hex);
  height: 100%;
  outline: none;
}

.search-input-field::-moz-placeholder {
  color: var(--text-muted-hex);
}

.search-input-field::placeholder {
  color: var(--text-muted-hex);
}

.search-icon-left {
  color: var(--text-muted-hex);
  display: flex;
  align-items: center;
  justify-content: center;
}

.search-btn-action {
  width: 38px;
  height: 38px;
  background-color: var(--highlight-hex);
  border: none;
  border-radius: 9999px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  cursor: pointer;
  transition: background-color 0.2s ease, transform 0.1s ease;
}

.search-btn-action:hover { background-color: #C81E27; }

.search-btn-action:active {
  transform: scale(0.95);
}

/* --- CARTÕES DE LISTA HORIZONTAIS --- */

.horizontal-restaurant-card {
  display: flex;
  background-color: var(--card-bg-hex);
  border: none;
  box-shadow: var(--soft-shadow);
  border-radius: 20px;
  padding: 16px;
  gap: 16px;
  transition: transform 0.25s ease, box-shadow 0.25s ease;
  cursor: pointer;
}

.horizontal-restaurant-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--float-shadow);
}

.restaurant-card-image-wrapper {
  width: 80px;
  height: 80px;
  flex-shrink: 0;
  border-radius: 12px;
  overflow: hidden;
  background-color: #f1f5f9;
}

.restaurant-card-image-wrapper img {
  width: 100%;
  height: 100%;
  -o-object-fit: cover;
     object-fit: cover;
}

.restaurant-card-content {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  flex-grow: 1;
}

.restaurant-card-title {
  font-size: 1.05rem;
  font-weight: 600;
  color: var(--text-hex);
  line-height: 1.25;
}

.restaurant-card-tag {
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--highlight-hex);
  display: inline-block;
}

.restaurant-card-location {
  font-size: 0.8rem;
  color: var(--text-muted-hex);
  display: flex;
  align-items: center;
  gap: 4px;
}

/* --- CONFIGURAÇÕES DE PERFIL / CAMPOS EMPILHADOS --- */

.profile-data-group {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
}

.profile-data-block {
  display: flex;
  align-items: center;
  background-color: var(--card-bg-hex);
  border: none;
  box-shadow: var(--soft-shadow);
  border-radius: 20px;
  padding: 16px;
  gap: 16px;
  position: relative;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.profile-data-block:hover {
  transform: translateY(-2px);
  box-shadow: var(--float-shadow);
}

.profile-data-icon {
  color: var(--text-muted-hex);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.profile-data-text {
  display: flex;
  flex-direction: column;
  flex-grow: 1;
  gap: 2px;
}

.profile-data-label {
  font-size: 0.8rem;
  font-weight: 400;
  color: var(--text-muted-hex);
}

.profile-data-value {
  font-size: 0.95rem;
  font-weight: 600;
  color: var(--text-hex);
}

.profile-data-edit {
  color: var(--text-muted-hex);
  cursor: pointer;
  transition: color 0.2s ease, transform 0.1s ease;
  display: flex;
  align-items: center;
  justify-content: center;
}

.profile-data-edit:hover {
  color: var(--primary-hex);
  transform: scale(1.05);
}

/* --- ESTADOS VAZIOS (EMPTY STATES) --- */

.empty-state-view {
  display: flex;
  flex-direction: column;
  align-items: center;
