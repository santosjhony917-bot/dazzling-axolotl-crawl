/* Fix para espaço extra no topo em WebViews iOS.
   Receita replicada de cadastro.php (que NAO apresenta a linha branca no topo
   no WKWebView): body usa min-height:100vh, SEM position:relative e SEM
   height:100% -- esses, combinados com o margin-top do .painelGeral e a
   box-shadow da barra fixa, produziam a linha fina branca no topo do app. */
html {
  margin: 0;
  padding: 0;
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  /* padding-top desloca o conteudo para baixo da barra fixa (44px) E impede o
     margin collapse do .painelGeral -- por isso NAO ha scroll/faixa branca.
     Sem min-height:100vh para o body nao exceder a viewport sem necessidade. */
  padding-top: 44px;
  padding-bottom: 24px;
  -webkit-overflow-scrolling: touch;
}

/* iOS WebView: alem dos 44px da barra, soma a safe-area (notch/status bar),
   que tambem eh pintada pela propria barra fixa (top:0). */
@supports (-webkit-touch-callout: none) {
  body {
    padding-top: calc(44px + env(safe-area-inset-top, 0px));
  }
}

<script>

    // Loading moderno reutilizável (anel girando com a cor da barra)
    function ccmShowLoading() {
        $.LoadingOverlay("show", {
            image: "",
            custom: '<div class="ccm-spinner"></div>',
            // No Safari/iOS o auto-resize do plugin mede o elemento antes do
            // layout e acaba zerando o tamanho do spinner (fica invisível).
            // Desligamos para respeitar o tamanho fixo definido no CSS.
            customAutoResize: false,
            // Sem fade-in: por padrão o plugin faz fadeTo(400ms). Como a
            // navegação ocorre logo em seguida, no Safari o overlay congelava
            // quase transparente e parecia não aparecer. Exibe instantâneo.
            fade: false,
            background: "rgba(23,23,23,.65)",
            zIndex: 99999999
        });
    }

    function navegarComOverlay(url, replace = false)
    {
        // Quando é App nativo - já tem um Loading
        if (inWebviewJs() == false)
        {
            ccmShowLoading();
        }

        var irPara = function () {
            if (replace)
                window.location.replace(url);
            else
                window.location.href = url;
        };

        // Safari/iOS descarta o frame de paint pendente ao iniciar a navegação,
        // então o requestAnimationFrame não chega a pintar o spinner. Nesses
        // browsers usamos um pequeno timeout (suficiente para pintar, bem menor
        // que os 225ms antigos). Nos demais, 2x rAF navega assim que o spinner
        // é pintado (~16-33ms), mantendo o clique bem responsivo.
        if (isAppleWebKit) {
            setTimeout(irPara, 60);
        } else {
            requestAnimationFrame(function () {
                requestAnimationFrame(irPara);
            });
        }

        setTimeout(function(){
            $.LoadingOverlay("hide");
        }, 3000);
    }

    function showOverlayCarregando()
    {
        // Quando é App nativo - já tem um Loading
        if (inWebviewJs() == false)
        {
            ccmShowLoading();
        }

        setTimeout(function(){
            $.LoadingOverlay("hide");
        }, 3000);
    }

    // Detecta iOS Safari
    var isIOSSafari = /iPad|iPhone|iPod/.test(navigator.userAgent) && /Safari/.test(navigator.userAgent) && !/Chrome/.test(navigator.userAgent);

    // Detecta qualquer browser WebKit no iOS/iPadOS (Safari, Chrome/CriOS,
    // Firefox/FxiOS e iPadOS 13+ que se reporta como Mac com touch). Todos
    // descartam o frame de paint ao navegar, então o spinner precisa de um
    // pequeno timeout em vez do requestAnimationFrame.
    var isAppleWebKit = /iPad|iPhone|iPod/.test(navigator.userAgent)
        || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    // Função para esconder overlay de forma robusta
    function hideOverlayRobust() {
        try {
            if (typeof $.LoadingOverlay !== 'undefined') {
                $.LoadingOverlay("hide");
            }
        } catch(e) {
            console.log('Erro ao esconder overlay:', e);
        }
    }

    // Detecta quando a página é carregada via history back
    window.addEventListener('pageshow', function(event) {
        hideOverlayRobust();
        
        // Para iOS Safari, adiciona um delay extra
        if (isIOSSafari) {
            setTimeout(hideOverlayRobust, 100);
        }
    });

    // Detecta mudanças de visibilidade (importante para iOS)
    document.addEventListener('visibilitychange', function() {
        if (!document.hidden) {
            hideOverlayRobust();
        }
    });

    // Detecta quando a página recebe foco (fallback para iOS)
    window.addEventListener('focus', function() {
        hideOverlayRobust();
    });

    // Limpa o overlay quando sair da página
    window.addEventListener('pagehide', function() {
        hideOverlayRobust();
    });

    // Esconde overlay quando a página carrega completamente
    function onDocumentReady(callback) {
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            callback();
        } else {
            document.addEventListener('DOMContentLoaded', callback);
        }
    }
    
    onDocumentReady(function() {
        hideOverlayRobust();
        
        // Para iOS Safari, adiciona verificações extras
        if (isIOSSafari) {
            setTimeout(hideOverlayRobust, 500);
            setTimeout(hideOverlayRobust, 1000);
        }
    });


    function inWebviewJs() {
        const ua = navigator.userAgent || navigator.vendor || window.opera;

        // iOS WebView (WKWebView/UIWebView não exibem “Safari/” no UA)
        const isIOSWebView =
            /iPad|iPhone|iPod/.test(ua) && /Mobile\/\w+/.test(ua) && !/Safari/.test(ua);

        // Android WebView (UA contém “wv” ou “Version/… Chrome/…”)
        const isAndroidWebView =
            /Android/.test(ua) && /(wv|Version\/[\d.]+).*Chrome\/[\d.]+/.test(ua);

        // Detecta browsers internos do Facebook/Instagram
        const isFacebookInApp = /FB_IAB|FB4A|Instagram|FBAV/.test(ua);

        // Regra final
        return (isIOSWebView || isAndroidWebView) && !isFacebookInApp;
    }
